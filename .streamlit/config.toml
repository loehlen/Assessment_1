[theme]
# Always use the light theme, even if a student's computer is set to
# dark mode (the app's pink cards and white buttons are designed for
# a light background)
base = "light"

# Accent colour for Streamlit's own widgets (radio buttons, focus
# rings, links), matching the pink used in shared.py
primaryColor = "#9B6574"

# Page background and text colour, matching the palette in shared.py.
# No secondaryBackgroundColor: Streamlit's default light grey keeps
# its loading placeholders faint instead of pink
backgroundColor = "#FFFFFF"
textColor = "#30313D"

[client]
# Hide Streamlit's automatic page list (it shows the file names
# "home" and "chatbot"); shared.py draws the page links instead,
# as "Introduction" and "Chatbot"
showSidebarNavigation = false